services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kr2-app:1.1
    user: "10001:10001"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      STUDENT: "Demchenkov"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
      - frontend

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    env_file:
      - .env
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  redis_data:
    name: redis_data

